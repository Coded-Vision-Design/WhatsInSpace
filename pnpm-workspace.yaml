# Dependency overrides.
#
# These live here rather than under the "pnpm" key in package.json because
# pnpm 11 no longer reads that field, and CI resolves pnpm via corepack
# without a pinned version. Keeping them here means both pnpm 10 and 11
# honour the pinned resolutions.
overrides:
  postcss@<8.5.10: '>=8.5.10'
  # DoS via exponential-time expansion of consecutive non-expanding {} groups.
  # Reached through minimatch -> eslint.
  brace-expansion@<5.0.6: '>=5.0.6'
  # Inherited libvips CVE-2026-33327, CVE-2026-33328, CVE-2026-35590,
  # CVE-2026-35591. Optional dependency of next, which pins ^0.34.5, so the
  # override is the only way onto a patched release before next 16.3.
  sharp@<0.35.3: '>=0.35.3'
